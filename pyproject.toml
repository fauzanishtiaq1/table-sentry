[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "table-sentry"
version = "0.1.0"
description = "Deterministic, read-only diagnostics for CSV and JSONL tables"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fauzan Ishtiaq" }]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "License :: OSI Approved :: MIT License"]

[project.scripts]
table-sentry = "table_sentry.cli:main"

[tool.setuptools.packages.find]
include = ["table_sentry*"]
